<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440">
  <defs>
    <!-- Outer Heraldic Shield Path -->
    <path id="shieldOutlinePath" d="M 200 14 C 150 0 80 22 45 36 C 68 80 72 120 48 145 C 36 160 30 200 30 230 C 30 320 110 390 200 426 C 290 390 370 320 370 230 C 370 200 364 160 352 145 C 328 120 332 80 355 36 C 320 22 250 0 200 14 Z" />
    
    <clipPath id="shieldShapeClip">
      <use href="#shieldOutlinePath" />
    </clipPath>

    <!-- Path for motto text: DIOS, CIENCIA Y LABOR -->
    <path id="mottoArcTextPath" d="M 96 308 A 128 128 0 0 0 304 308" fill="none" />
    
    <!-- Path for lower name text: RAFAEL URIBE URIBE -->
    <path id="nameArcTextPath" d="M 58 355 A 165 165 0 0 0 342 355" fill="none" />
  </defs>

  <!-- Outer Shield Frame with Heavy Black Stroke -->
  <use href="#shieldOutlinePath" fill="#E10600" stroke="#000000" stroke-width="8" stroke-linejoin="round" />

  <!-- Shield Contents Clipped strictly inside Heraldic Shape -->
  <g clip-path="url(#shieldShapeClip)">
    <!-- 1. TOP RED BANNER -->
    <rect x="0" y="0" width="400" height="82" fill="#E10600" />
    <text x="200" y="58" fill="#FFFFFF" font-size="22" font-weight="900" font-family="'Arial Black', Impact, Arial, sans-serif" text-anchor="middle" letter-spacing="0.8">INSTITUCION EDUCATIVA</text>
    <line x1="0" y1="82" x2="400" y2="82" stroke="#000000" stroke-width="5" />

    <!-- 2. YELLOW STRIPE -->
    <rect x="0" y="82" width="400" height="24" fill="#FFEA00" />
    <line x1="0" y1="106" x2="400" y2="106" stroke="#000000" stroke-width="5" />

    <!-- 3. DIAGONAL MIDDLE FIELD: YELLOW TOP-LEFT / CYAN-BLUE BOTTOM-RIGHT -->
    <polygon points="0,106 400,106 400,265 0,265" fill="#FFEA00" />
    <polygon points="400,106 400,265 0,265" fill="#009EE3" />
    <line x1="400" y1="106" x2="0" y2="265" stroke="#000000" stroke-width="5" />

    <!-- 4. OPEN BOOK EMBLEM -->
    <g transform="translate(120, 142)">
      <!-- Left Page -->
      <path d="M 10 5 Q 40 0 78 10 L 78 102 Q 40 94 10 98 Z" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
      <!-- Right Page -->
      <path d="M 82 10 Q 120 0 150 5 L 150 98 Q 120 94 82 102 Z" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
      <!-- Center Spine Line -->
      <line x1="80" y1="10" x2="80" y2="102" stroke="#000000" stroke-width="3.5" />

      <!-- Cursive script lines on pages -->
      <path d="M 20 22 Q 45 18 68 22 M 20 32 Q 45 28 68 32 M 20 42 Q 45 38 68 42 M 20 52 Q 45 48 68 52 M 20 62 Q 45 58 68 62 M 20 72 Q 45 68 68 72 M 20 82 Q 45 78 68 82" stroke="#000000" stroke-width="2.2" fill="none" stroke-linecap="round" />
      <path d="M 92 22 Q 115 18 140 22 M 92 32 Q 115 28 140 32 M 92 42 Q 115 38 140 42 M 92 52 Q 115 48 140 52 M 92 62 Q 115 58 140 62 M 92 72 Q 115 68 140 72 M 92 82 Q 115 78 140 82" stroke="#000000" stroke-width="2.2" fill="none" stroke-linecap="round" />
    </g>

    <!-- 5. BLACK ANCHOR-CROSS (CRUZ ANCLA) -->
    <g fill="#000000" stroke="#000000">
      <!-- Ring Top -->
      <circle cx="200" cy="112" r="15" fill="#000000" />
      <circle cx="200" cy="112" r="6.5" fill="#FFEA00" stroke="#000000" stroke-width="2" />

      <!-- Crossbar -->
      <rect x="122" y="136" width="156" height="15" rx="3" fill="#000000" />
      <circle cx="122" cy="143.5" r="8" fill="#000000" />
      <circle cx="278" cy="143.5" r="8" fill="#000000" />

      <!-- Main Vertical Shaft -->
      <rect x="192" y="120" width="16" height="155" fill="#000000" />

      <!-- Anchor Flukes Bottom Arc -->
      <path d="M 130 228 C 130 308 270 308 270 228" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="round" />
      <!-- Left Arrow Tip -->
      <path d="M 130 210 L 112 242 L 144 242 Z" fill="#000000" />
      <!-- Right Arrow Tip -->
      <path d="M 270 210 L 256 242 L 288 242 Z" fill="#000000" />
    </g>

    <!-- 6. WHITE CURVED BANNER WITH LE MA -->
    <path d="M 75 258 C 135 298 265 298 325 258 L 315 298 C 245 338 155 338 85 298 Z" fill="#FFFFFF" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
    <text fill="#000000" font-size="15" font-weight="900" font-family="'Arial Black', Impact, Arial, sans-serif" letter-spacing="0.5">
      <textPath href="#mottoArcTextPath" startOffset="50%" text-anchor="middle">DIOS, CIENCIA Y LABOR</textPath>
    </text>

    <!-- 7. LOWER RED BANNER AREA WITH INSTITUTION NAME -->
    <path d="M 52 298 C 120 348 280 348 348 298 L 360 350 C 275 410 125 410 40 350 Z" fill="#E10600" stroke="#000000" stroke-width="3.5" />
    <text fill="#FFFFFF" font-size="20" font-weight="900" font-family="'Arial Black', Impact, Arial, sans-serif" letter-spacing="1">
      <textPath href="#nameArcTextPath" startOffset="50%" text-anchor="middle">RAFAEL URIBE URIBE</textPath>
    </text>
  </g>

  <!-- Heavy Outer Contour Line -->
  <use href="#shieldOutlinePath" fill="none" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
</svg>
